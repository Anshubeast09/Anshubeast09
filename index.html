<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aadarsh Hub</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head><body>
<div id="toast"></div>

<section id="landing" class="center">
  <div class="logo big">AH</div>
  <h1>One hub. Our universe.</h1>
  <p class="mut">A private community for friends. Founded by Aadarsh Prajapati.</p>
  <button class="btn" id="enter">Enter the Hub</button>
</section>

<section id="login" class="center hide">
  <form id="lf" class="card narrow">
    <h2>Sign in</h2>
    <div class="tabs"><button type="button" class="on" data-r="member">Member</button><button type="button" data-r="owner">Owner</button></div>
    <input id="em" type="email" placeholder="Email" required autocomplete="username">
    <input id="pw" type="password" placeholder="Password" required autocomplete="current-password">
    <button class="btn">Sign in</button>
    <button type="button" class="link" id="back">Back to home</button>
  </form>
</section>

<div id="app" class="hide">
  <aside id="side">
    <div class="logo">AH</div>
    <nav>
      <button data-v="ov" class="on">Overview</button>
      <button data-v="chat">Group Chat</button>
      <button data-v="files">My Files</button>
      <button data-v="gal">Common Gallery</button>
      <button data-v="att">Attendance</button>
      <button data-v="mem" class="own">Members</button>
      <button data-v="set" class="own">Chat Settings</button>
    </nav>
    <button class="link" id="out">Sign out</button>
  </aside>
  <main>
    <button id="burger">Menu</button>

    <section id="v-ov">
      <h2 id="hi"></h2>
      <div class="grid" id="stats"></div>
      <form id="pwf" class="card narrow">
        <h2>Change password</h2>
        <input id="p0" type="password" placeholder="Current password" required autocomplete="current-password">
        <input id="p1" type="password" placeholder="New password (min 8 characters)" minlength="8" required autocomplete="new-password">
        <input id="p2" type="password" placeholder="Confirm new password" minlength="8" required autocomplete="new-password">
        <button class="btn">Update password</button>
      </form>
    </section>

    <section id="v-chat" class="hide">
      <h2>Group chat</h2>
      <div id="msgs" class="card"></div>
      <div id="rp" class="reply hide"></div>
      <div id="sug" class="hide"></div>
      <div class="row">
        <input id="ci" placeholder="Message (type @ to mention)" maxlength="4000">
        <label class="btn alt">Attach<input id="cf" type="file" hidden></label>
        <button class="btn" id="send">Send</button>
      </div>
      <small id="cfn" class="mut"></small>
    </section>

    <section id="v-files" class="hide">
      <h2>My files</h2>
      <p class="mut" id="quota"></p>
      <label class="btn">Upload file<input id="mf" type="file" hidden></label>
      <div id="flist" class="list"></div>
    </section>

    <section id="v-gal" class="hide">
      <h2>Common gallery</h2>
      <label class="btn" id="gup">Upload to gallery<input id="gf" type="file" hidden></label>
      <div id="glist" class="grid"></div>
    </section>

    <section id="v-att" class="hide">
      <h2>Attendance</h2>
      <p class="mut" id="today"></p>
      <div class="row">
        <select id="as"><option value="present">Present</option><option value="absent">Absent</option><option value="leave">Leave</option></select>
        <input id="an" placeholder="Note (optional)">
        <button class="btn" id="asave">Mark</button>
      </div>
      <div id="alist" class="list"></div>
    </section>

    <section id="v-mem" class="hide">
      <h2>Members</h2>
      <form id="mf2" class="card row">
        <input id="mn" placeholder="Display name" required>
        <input id="me" type="email" placeholder="Email" required>
        <input id="mp" placeholder="Temporary password" minlength="8" required>
        <button class="btn">Create member</button>
      </form>
      <div id="mlist"></div>
    </section>

    <section id="v-set" class="hide">
      <h2>Chat settings</h2>
      <div class="card narrow">
        <label class="row"><input type="checkbox" id="sc"> Automatic chat cleanup</label>
        <label>Messages to keep (1 to 10000)<input id="sr" type="number" min="1" max="10000"></label>
        <button class="btn" id="ssave">Save settings</button>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body></html>
