<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXORA</title>
<meta name="theme-color" content="#0a0d1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEXORA">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="toast" role="status"></div>

<section id="landing" class="center">
  <img class="logo big" src="logo.svg" alt="NEXORA logo">
  <div class="word">NEXORA</div>
  <h1>One hub. Our universe.</h1>
  <p class="mut">A private community for friends. Founded by Aadarsh Prajapati.</p>
  <button class="btn" id="enter">Enter the Hub</button>
  <button class="btn alt inst hide">Install app</button>
  <p id="ioshint" class="mut hide">On iPhone: tap Share, then Add to Home Screen.</p>
  <small class="mut ver"></small>
</section>

<section id="login" class="center hide">
  <form id="lf" class="card narrow">
    <h2>Sign in</h2>
    <div class="tabs"><button type="button" class="on" data-r="member">Member</button><button type="button" data-r="owner">Owner</button></div>
    <input id="em" type="email" placeholder="Email" required autocomplete="username">
    <input id="pw" type="password" placeholder="Password" required autocomplete="current-password">
    <button class="btn">Sign in</button>
    <button type="button" class="link" id="back">Back to home</button>
  </form>
</section>

<div id="app" class="hide">
  <div id="scrim" class="hide"></div>
  <aside id="side">
    <div class="brand"><img class="logo" src="logo.svg" alt="NEXORA logo"><b>NEXORA</b></div>
    <div id="chip" class="chip"></div>
    <nav>
      <button data-v="ov" class="on">Dashboard</button>
      <button data-v="chat">Group Chat <span class="bdg hide" id="cb"></span></button>
      <button data-v="dm">Messages <span class="bdg hide" id="db"></span></button>
      <button data-v="files">My Files</button>
      <button data-v="gal">Common Gallery</button>
      <button data-v="game">🎮 Game Zone</button>
      <button data-v="acct">Settings</button>
      <button data-v="own" class="own">Owner Settings</button>
