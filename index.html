
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aadarsh Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header class="brand">
            <div class="logo">AH</div>
            <h1>AADARSH HUB</h1>
            <p>YOUR PERSONAL DIGITAL SPACE</p>
        </header>

        <section class="developer">
            <div class="avatar">A</div>
            <h2>Aadarsh Prajapati</h2>
            <p class="role">Founder & Developer</p>
            <p class="bio">Building something personal.</p>
        </section>

        <section class="login-section">
            <h3>LOGIN TO CONTINUE</h3>

            <button class="login-card" onclick="openLogin('owner')">
                <span class="login-icon">?</span>
                <span class="login-info">
                    <strong>Owner Login</strong>
                    <small>Exclusive access for the owner</small>
                </span>
                <span class="arrow">?</span>
            </button>

            <button class="login-card" onclick="openLogin('member')">
                <span class="login-icon">?</span>
                <span class="login-info">
                    <strong>Member Login</strong>
                    <small>Access for invited members</small>
                </span>
                <span class="arrow">?</span>
            </button>
        </section>

        <section id="login-panel" class="login-panel hidden">
            <h3 id="login-title">Login</h3>

            <form onsubmit="handleLogin(event)">
                <label>Username</label>
                <input id="username" type="text"
                    placeholder="Enter username" required>

                <label>Password</label>
                <input id="password" type="password"
                    placeholder="Enter password" required>

                <button class="submit-btn" type="submit">
                    Continue ?
                </button>
            </form>

            <button class="cancel-btn" onclick="closeLogin()">
                Cancel
            </button>

            <p id="login-message"></p>
        </section>

        <footer>
            © 2026 Aadarsh Hub. All rights reserved.
        </footer>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
